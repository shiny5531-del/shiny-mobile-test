name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Flutter platform files
        run: |
          flutter create \
            --project-name shiny_mobile_test \
            --org com.increate \
            --platforms android \
            .

      - name: Set Android app name
        run: |
          sed -i 's/android:label="shiny_mobile_test"/android:label="Shiny Mobile Test"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Restore fixed debug signing key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Remove generated default test
        run: rm -f test/widget_test.dart

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test || true

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk \
             release/Shiny_Mobile_Test_v0.1.1-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiny-Mobile-Test-v0.1.1-test
          path: release/Shiny_Mobile_Test_v0.1.1-test.apk
          retention-days: 14

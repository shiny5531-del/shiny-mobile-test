name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Create Flutter Android files
        run: |
          flutter create \
            --project-name shiny_mobile_test \
            --org com.increate \
            --platforms android \
            .

      - name: Set Android app name
        run: |
          sed -i 's/android:label="shiny_mobile_test"/android:label="파크골프 스코어카드"/' \
            android/app/src/main/AndroidManifest.xml

      - name: Restore fixed debug signing key when configured
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            if printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"; then
              chmod 600 "$HOME/.android/debug.keystore"
              echo "Fixed debug keystore restored from ANDROID_DEBUG_KEYSTORE_BASE64."
            else
              rm -f "$HOME/.android/debug.keystore"
              echo "ANDROID_DEBUG_KEYSTORE_BASE64 is set but is not valid base64. Using the runner default debug keystore."
            fi
          else
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 is not set. Using the runner default debug keystore."
          fi

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Rename APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-debug.apk \
             release/Shiny_Mobile_Test_v0.1.2-test.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shiny-Mobile-Test-v0.1.2-test
          path: release/Shiny_Mobile_Test_v0.1.2-test.apk
          retention-days: 7
